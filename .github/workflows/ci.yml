name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prisma Client is generated from schema; needed for typecheck to resolve @prisma/client.
      - run: npm run db:generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test
