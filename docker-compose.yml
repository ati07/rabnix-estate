# Local Postgres + PostGIS for development.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also wipe data)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rabnix-estate-db
    environment:
      POSTGRES_USER: rabnix
      POSTGRES_PASSWORD: rabnix
      POSTGRES_DB: rabnix_estate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
