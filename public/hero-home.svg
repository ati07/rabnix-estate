<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="Modern verified home">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F6F1"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163b5c"/>
      <stop offset="1" stop-color="#0F2A43"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C39A"/>
      <stop offset="1" stop-color="#18A67D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFEDE3"/>
      <stop offset="1" stop-color="#7FD3BC"/>
    </linearGradient>
  </defs>

  <rect width="640" height="520" rx="28" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="502" cy="118" r="56" fill="#18A67D" opacity="0.14"/>
  <circle cx="502" cy="118" r="30" fill="#18A67D" opacity="0.9"/>

  <!-- distant skyline -->
  <rect x="58" y="232" width="70" height="150" rx="6" fill="#163b5c" opacity="0.30"/>
  <rect x="138" y="188" width="58" height="194" rx="6" fill="#163b5c" opacity="0.45"/>
  <rect x="470" y="212" width="82" height="170" rx="6" fill="#163b5c" opacity="0.38"/>
  <rect x="556" y="250" width="46" height="132" rx="6" fill="#163b5c" opacity="0.28"/>

  <!-- ground band -->
  <rect x="0" y="380" width="640" height="140" fill="#0F2A43" opacity="0.06"/>

  <!-- main house -->
  <rect x="208" y="200" width="234" height="192" rx="12" fill="url(#navy)"/>
  <rect x="250" y="146" width="152" height="122" rx="12" fill="url(#navy)"/>
  <rect x="208" y="194" width="234" height="12" rx="6" fill="url(#emerald)"/>
  <!-- windows -->
  <rect x="230" y="232" width="58" height="62" rx="7" fill="url(#glass)"/>
  <rect x="300" y="232" width="58" height="62" rx="7" fill="url(#glass)"/>
  <rect x="370" y="232" width="50" height="62" rx="7" fill="url(#glass)"/>
  <rect x="288" y="170" width="76" height="58" rx="7" fill="url(#glass)"/>
  <!-- door -->
  <rect x="300" y="322" width="54" height="70" rx="7" fill="url(#emerald)"/>

  <!-- greenery -->
  <circle cx="182" cy="390" r="36" fill="url(#emerald)"/>
  <circle cx="150" cy="402" r="24" fill="#18A67D" opacity="0.85"/>
  <circle cx="470" cy="392" r="32" fill="url(#emerald)"/>
  <circle cx="500" cy="402" r="22" fill="#18A67D" opacity="0.85"/>

  <!-- path -->
  <path d="M300 392 L354 392 L392 500 L262 500 Z" fill="#0F2A43" opacity="0.08"/>
</svg>
